name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/adam-release-password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p adam-release-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: shadow-cljs.edn
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Verify tag and package versions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const lockfile = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const expected = `v${manifest.version}`;
          if (process.env.GITHUB_REF_NAME !== expected) {
            throw new Error(`tag ${process.env.GITHUB_REF_NAME} does not match package version ${expected}`);
          }
          if (lockfile.version !== manifest.version || lockfile.packages[""].version !== manifest.version) {
            throw new Error("package-lock.json version does not match package.json");
          }
          NODE
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run deterministic package validation
        run: npm run ci
      - name: Run live Neo4j suite
        run: npm run test:neo4j
        env:
          ADAM_TEST_NEO4J_URI: bolt://127.0.0.1:7687
          ADAM_TEST_NEO4J_USERNAME: neo4j
          ADAM_TEST_NEO4J_PASSWORD: adam-release-password
          ADAM_TEST_NEO4J_DATABASE: neo4j
      - name: Build release tarball and checksum
        id: package
        run: |
          mkdir release-assets
          filename=$(npm pack --pack-destination release-assets --silent)
          tarball="$PWD/release-assets/$filename"
          (cd release-assets && sha256sum "$filename" > "$filename.sha256")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Smoke-test exact release tarball
        run: node --test test/package.test.js
        env:
          ADAM_PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
      - name: Ensure release does not already exist
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create draft release with tested artifacts
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/*
          --verify-tag
          --draft
          --generate-notes
          --title "adam $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
